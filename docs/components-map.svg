<rect x="284" y="182" width="240" height="104" rx="12" fill="#e3e5fb" stroke="#5b5bd6" stroke-width="2.2"/>
<text x="404" y="215" text-anchor="middle" font-size="17.5" fill="#1e2a47">Vercel Cron fires</text>
<text x="404" y="240" text-anchor="middle" font-size="17.5" fill="#1e2a47">every day at 6:00 am</text>
<text x="404" y="265" text-anchor="middle" font-size="17.5" fill="#1e2a47">IST, with a secret</text>
<rect x="284" y="882" width="240" height="104" rx="12" fill="#ffe1d5" stroke="#e8743b" stroke-width="2.2"/>
<text x="404" y="915" text-anchor="middle" font-size="17.5" fill="#1e2a47">Clicks “Check for</text>
<text x="404" y="940" text-anchor="middle" font-size="17.5" fill="#1e2a47">new rounds” at</text>
<text x="404" y="965" text-anchor="middle" font-size="17.5" fill="#1e2a47">any time</text>
<rect x="574" y="322" width="240" height="104" rx="12" fill="#ffffff" stroke="#5b8def" stroke-width="2.2"/>
<text x="694" y="342.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">10 live RSS feeds:</text>
<text x="694" y="367.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Google News, Inc42,</text>
<text x="694" y="392.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Entrackr, ET Startups,</text>
<text x="694" y="417.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">YourStory, TechCrunch</text>
<rect x="864" y="322" width="240" height="104" rx="12" fill="#ffffff" stroke="#5b8def" stroke-width="2.2"/>
<text x="984" y="355" text-anchor="middle" font-size="17.5" fill="#1e2a47">Frankfurter: today’s</text>
<text x="984" y="380" text-anchor="middle" font-size="17.5" fill="#1e2a47">USD → INR rate, so</text>
<text x="984" y="405" text-anchor="middle" font-size="17.5" fill="#1e2a47">every amount is in ₹</text>
<rect x="864" y="742" width="240" height="104" rx="12" fill="#d3eef3" stroke="#1c97ad" stroke-width="2.2"/>
<text x="984" y="775" text-anchor="middle" font-size="17.5" fill="#1e2a47">Thesis row, plus</text>
<text x="984" y="800" text-anchor="middle" font-size="17.5" fill="#1e2a47">memory of every seen</text>
<text x="984" y="825" text-anchor="middle" font-size="17.5" fill="#1e2a47">URL and past startup</text>
<rect x="864" y="882" width="240" height="104" rx="12" fill="#ffe1d5" stroke="#e8743b" stroke-width="2.2"/>
<text x="984" y="902.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Sets the thesis</text>
<text x="984" y="927.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">(₹ round size, min score)</text>
<text x="984" y="952.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">and re-scores the</text>
<text x="984" y="977.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">startups waiting</text>
<rect x="1154" y="462" width="240" height="104" rx="12" fill="#fff1c2" stroke="#d9a400" stroke-width="2.2"/>
<text x="1274" y="482.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Keeps last 24h,</text>
<text x="1274" y="507.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">funding news, unseen</text>
<text x="1274" y="532.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">URLs; blocks repeat</text>
<text x="1274" y="557.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">names + websites</text>
<rect x="1444" y="602" width="240" height="104" rx="12" fill="#d6f3e0" stroke="#2fa35a" stroke-width="2.2"/>
<text x="1564" y="622.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Screens seed rounds,</text>
<text x="1564" y="647.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">scores fit vs thesis,</text>
<text x="1564" y="672.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">researches founders,</text>
<text x="1564" y="697.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">drafts the email</text>
<rect x="1734" y="462" width="240" height="104" rx="12" fill="#fff1c2" stroke="#d9a400" stroke-width="2.2"/>
<text x="1854" y="495" text-anchor="middle" font-size="17.5" fill="#1e2a47">Morning Brief: ₹ amount,</text>
<text x="1854" y="520" text-anchor="middle" font-size="17.5" fill="#1e2a47">fit score, background,</text>
<text x="1854" y="545" text-anchor="middle" font-size="17.5" fill="#1e2a47">founders + draft</text>
<rect x="1734" y="882" width="240" height="104" rx="12" fill="#ffe1d5" stroke="#e8743b" stroke-width="3.4"/>
<text x="1854" y="902.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Reviews, edits, Send</text>
<text x="1854" y="927.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">or Skip; marks replies.</text>
<text x="1854" y="952.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">Nothing sends</text>
<text x="1854" y="977.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">without him</text>
<text x="1718" y="930" text-anchor="end" font-size="16" font-weight="800" fill="#e8743b">HUMAN</text>
<text x="1718" y="950" text-anchor="end" font-size="16" font-weight="800" fill="#e8743b">BOUNDARY →</text>
<rect x="1734" y="1022" width="240" height="104" rx="12" fill="#fbd5e5" stroke="#d6457f" stroke-width="2.2"/>
<text x="1854" y="1042.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">6 am summary to Rohit;</text>
<text x="1854" y="1067.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">sends each approved</text>
<text x="1854" y="1092.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">email; startup never</text>
<text x="1854" y="1117.5" text-anchor="middle" font-size="17.5" fill="#1e2a47">drafted again</text>
<rect x="1734" y="1162" width="240" height="104" rx="12" fill="#fde3dc" stroke="#e0533d" stroke-width="2.2"/>
<text x="1854" y="1195" text-anchor="middle" font-size="17.5" fill="#1e2a47">Gets a personal</text>
<text x="1854" y="1220" text-anchor="middle" font-size="17.5" fill="#1e2a47">email right after</text>
<text x="1854" y="1245" text-anchor="middle" font-size="17.5" fill="#1e2a47">the raise</text>
<text x="1011.5" y="1326" text-anchor="middle" font-size="17" fill="#5e6688">Dashed arrows show the flow of data. Every tool runs on a free tier: total cost ₹0. Live at freshraise.vercel.app</text>
